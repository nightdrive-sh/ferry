<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- The .dmg window's background (660 x 400 pt). After a change, render both sizes and commit them:
       rsvg-convert -w 660 -h 400 background.svg -o background.png
       rsvg-convert -w 1320 -h 800 background.svg -o background@2x.png
       macos/build.sh positions the icons to match: Ferry.app at (170, 235), Applications at (490, 235), 128 pt. -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".9"><stop offset="0" stop-color="#3a1660"/><stop offset="1" stop-color="#1e0c3a"/></radialGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="392" y2="0"><stop offset="0" stop-color="#ffb35c"/><stop offset=".45" stop-color="#ff4f9a"/><stop offset="1" stop-color="#b56bff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <!-- The iOS app's header: the icon, then "Ferry" in the system font, bold, in the accent colour (dark: #E0BFF2) -->
  <image href="icon.png" x="255" y="38" width="52" height="52"/>
  <text x="310" y="76" font-family="System Font" font-weight="700" font-size="34" fill="#E0BFF2">Ferry</text>
  <text x="330" y="118" text-anchor="middle" font-family="System Font" font-size="14" fill="#c9b6e4">Drag Ferry to Applications</text>
  <!-- Finder draws the icons' names in black on a background picture, in dark mode too: a light tag under each -->
  <rect x="122" y="306" width="96" height="24" rx="12" fill="#c39cf0" opacity=".95"/>
  <rect x="428" y="306" width="124" height="24" rx="12" fill="#c39cf0" opacity=".95"/>
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="7" filter="url(#glow)" opacity=".8"><path d="M268 230 H384"/><path d="M366 210 L390 230 L366 250"/></g>
    <g stroke-width="4"><path d="M268 230 H384"/><path d="M366 210 L390 230 L366 250"/></g>
  </g>
</svg>
